services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pulsenet-backend
    restart: unless-stopped
    env_file: ./backend/.env
    volumes:
      - speedtest-data:/data
    networks:
      - pulsenet
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: pulsenet-frontend
    restart: unless-stopped
    ports:
      - "3001:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - pulsenet
    environment:
      - VITE_API_URL=http://localhost:8000/api

  mysql:
    image: mariadb:10.11
    container_name: pulsenet-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE:      pulsenet
      MYSQL_USER:          pulsenet
      MYSQL_PASSWORD:      secret
      MYSQL_ROOT_PASSWORD: root_secret
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - pulsenet
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot_secret"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 40s

volumes:
  speedtest-data:
  mysql-data:

networks:
  pulsenet:
    driver: bridge