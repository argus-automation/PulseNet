services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pulsenet-backend
    restart: unless-stopped
    env_file: ./backend/.env
    volumes:
      - speedtest-data:/data  # Keep for SQLite fallback, but won't be used with PostgreSQL
    networks:
      - pulsenet
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: pulsenet-frontend
    restart: unless-stopped
    ports:
      - "3001:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - pulsenet
    environment:
      - VITE_API_URL=http://localhost:8000/api

  postgres:
    image: postgres:16-alpine
    container_name: pulsenet-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB:       pulsenet
      POSTGRES_USER:     pulsenet
      POSTGRES_PASSWORD: secret
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - pulsenet
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pulsenet"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  speedtest-data:
  postgres-data:

networks:
  pulsenet:
    driver: bridge